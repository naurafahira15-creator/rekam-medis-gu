<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GU Medical Record</title>
<meta name="theme-color" content="#f5f9ff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f8ff;--card:#fff;--tx:#1d2a4d;--mu:#6b7a9c;--br:#e2ebf9;--pr:#4f8cff;--pr2:#e6f0ff;--wn:#b7791f;--wb:#fff3d1;--dg:#d64545;--db:#ffe9e9;--ok:#1f9d6b;--ob:#d9f7ea;--sh:0 8px 24px rgba(79,140,255,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:104px;background:radial-gradient(900px 420px at 5% -10%,#d8e8ff 0,transparent 60%),radial-gradient(700px 420px at 100% 0,#dff4ff 0,transparent 55%),#f5f9ff;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(245,249,255,.9);backdrop-filter:blur(14px);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--br);padding:10px 16px;z-index:9;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#5b9bff,#8fd3ff);display:grid;place-items:center;box-shadow:0 6px 14px rgba(79,140,255,.35);animation:float 5s ease-in-out infinite}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
header b{font-size:15px;display:block;line-height:1.2}header small{color:var(--mu);font-size:11px}
.av{background:var(--pr2);color:var(--pr);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px}
main{max-width:760px;margin:0 auto;padding:16px}
#app>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
h2{font-size:20px;margin:6px 0 14px;letter-spacing:-.3px}h3{font-size:14px;margin:18px 0 8px;color:var(--pr)}
.card{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(79,140,255,.16)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--br);border-radius:18px;padding:14px;box-shadow:var(--sh);transition:transform .25s}
.stat:hover{transform:translateY(-3px) scale(1.02)}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:#d3e4ff;opacity:.7}
.stat:nth-child(3n+2)::after{background:#d4f5e8}.stat:nth-child(3n)::after{background:#e6defc}
.stat b{font-size:28px;display:block;letter-spacing:-.5px;position:relative}.stat span{color:var(--mu);font-size:12px;position:relative}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#5b9bff 0%,#7cc4ff 60%,#a3e3ff 100%);margin-bottom:14px;box-shadow:0 16px 32px rgba(79,140,255,.3)}
.hero>*{position:relative;z-index:1}.hero h1{margin:0;font-size:24px;letter-spacing:-.5px}.hero p{margin:4px 0 16px;opacity:.92}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.22);animation:float 7s ease-in-out infinite}
.hero::before{width:140px;height:140px;right:-30px;top:-40px}.hero::after{width:90px;height:90px;right:70px;bottom:-40px;animation-delay:-3s}
.hero button{background:#fff;color:#3b74e6;box-shadow:0 8px 18px rgba(30,60,140,.18)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--br);border-radius:12px;background:#f8fbff;color:var(--tx);font:inherit;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);background:#fff;box-shadow:0 0 0 4px rgba(79,140,255,.16)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:linear-gradient(135deg,#5b9bff,#7cc4ff);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 6px 14px rgba(79,140,255,.3);transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-1px);filter:brightness(1.04)}button:active{transform:scale(.96)}
button.s{background:var(--pr2);color:#3b74e6;box-shadow:none}
button.w{width:100%;padding:14px;margin-top:14px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border:1.5px solid var(--br);border-radius:999px;background:#f8fbff;color:var(--tx);font-weight:600;font-size:13px;box-shadow:none}
.chip:hover{border-color:var(--pr);background:var(--pr2)}
.chip.on{background:linear-gradient(135deg,#5b9bff,#7cc4ff);color:#fff;border-color:transparent;animation:pop .35s;box-shadow:0 6px 12px rgba(79,140,255,.3)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--br)}
.li:last-child{border:0}.li small{color:var(--mu);display:block}
.badge{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:700;white-space:nowrap;border:0;box-shadow:none}
.Menunggu{background:var(--wb);color:var(--wn)}.Dalam{background:var(--pr2);color:#3b74e6}.Selesai{background:var(--ob);color:var(--ok)}
button.Menunggu,button.Dalam,button.Selesai{background:none}
button.Menunggu{background:var(--wb)}button.Dalam{background:var(--pr2)}button.Selesai{background:var(--ob)}
.Dalam::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;animation:pulse 1.4s infinite}
.alert{background:var(--db);color:var(--dg);border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700;font-size:14px;animation:shake .5s,glow 2s 1s infinite}
.fu{border-left:3px solid #8fc0ff;background:#f6faff;border-radius:0 14px 14px 0;padding:6px 12px 12px;margin:14px 0;animation:pop .4s both}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.bar i{display:block;height:14px;background:linear-gradient(90deg,#5b9bff,#9fdcff);border-radius:8px;min-width:4px;transform-origin:left;animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}
.bar span:first-child{width:104px;flex:none;color:var(--mu)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--br);white-space:nowrap}th{color:var(--mu);font-weight:700}tr:hover td{background:#f4f8ff}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(94%,520px);background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid #fff;border-radius:24px;box-shadow:0 14px 34px rgba(60,110,220,.22);display:flex;padding:6px;gap:2px;z-index:8;animation:navin .7s cubic-bezier(.2,.8,.2,1) both}
nav button{flex:1;background:none;color:var(--mu);border-radius:18px;padding:8px 2px;font-size:10.5px;font-weight:700;box-shadow:none;transition:background .25s,color .25s}
nav button:hover{filter:none;transform:none;background:#f1f6ff}
nav button.on{background:var(--pr2);color:#3b74e6}nav button.on svg{animation:bounce .5s}
nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.modal{position:fixed;inset:0;background:rgba(40,70,140,.35);backdrop-filter:blur(6px);z-index:20;overflow:auto;padding:14px;animation:fade .25s}
.paper{background:#fff;color:#111;max-width:640px;margin:0 auto;padding:24px;border-radius:18px;font-size:13px;box-shadow:0 20px 50px rgba(30,60,140,.3);animation:up .45s cubic-bezier(.2,.8,.2,1)}
.paper h1{font-size:16px;margin:0}.paper h4{margin:14px 0 4px;font-size:12px;border-bottom:1px solid #b9cdf0;padding-bottom:2px;letter-spacing:.5px;color:#2f5fc4}
.paper p{margin:2px 0}.paper .doc{border:1px dashed #9db8e6;border-radius:8px;padding:6px;min-height:34px}
.bt{display:flex;gap:8px;max-width:640px;margin:12px auto}.bt button{flex:1}
details.card>summary{cursor:pointer;font-weight:700;list-style:none}details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:"＋";float:right;color:var(--pr)}details[open].card>summary::after{content:"－"}.hint{display:block;color:var(--mu);font-size:12px;font-weight:500}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92)}60%{transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{opacity:.25;transform:scale(1.5)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(214,69,69,.14)}}
@keyframes bounce{40%{transform:translateY(-5px)}70%{transform:translateY(1px)}}
@keyframes navin{from{opacity:0;transform:translate(-50%,40px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media print{body>*:not(#pdf){display:none!important}body::before{display:none}#pdf{position:static;background:none;padding:0;backdrop-filter:none}.bt{display:none}.paper{max-width:none;padding:0;box-shadow:none}}
</style>
</head>

const bars=(a,mx)=>a.map(([l,n])=>`<div class="bar"><span>${l}</span><i style="width:${n/Math.max(mx,1)*55}%"></i><b>${n}</b></div>`).join("");
function stats(m){const seen=new Set();D.V.filter(v=>v.tgl<mon+"-01").forEach(v=>seen.add(v.pid));
const baru=new Set(m.filter(v=>v.jenis==="Baru").map(v=>v.pid)),uniq=new Set(m.map(v=>v.pid));return{baru:baru.size,lama:[...uniq].filter(x=>!baru.has(x)).length,uniq:uniq.size,sel:m.filter(v=>v.status==="Selesai").length}}
function rek(){const m=D.V.filter(v=>v.tgl.startsWith(mon)).sort((a,b)=>a.tgl<b.tgl?-1:1),s=stats(m),wk=[1,2,3,4,5].map(w=>["Minggu "+w,m.filter(v=>Math.ceil(+v.tgl.slice(8)/7)===w).length]),kc={};m.forEach(v=>v.kel.forEach(k=>kc[kn(k)]=(kc[kn(k)]||0)+1));
return`<h2>Rekap Bulanan</h2>${mf()}<div class="grid g3" style="margin-top:12px"><div class="stat"><b>${m.length}</b><span>Total kunjungan</span></div><div class="stat"><b>${s.uniq}</b><span>Pasien unik</span></div><div class="stat"><b>${s.baru}</b><span>Pasien baru</span></div><div class="stat"><b>${s.lama}</b><span>Pasien lama</span></div><div class="stat"><b>${s.sel}</b><span>Selesai</span></div><div class="stat"><b>${m.length-s.sel}</b><span>Belum selesai</span></div></div>
<div class="card" style="margin-top:12px"><b>Kunjungan per minggu</b>${bars(wk,Math.max(...wk.map(x=>x[1])))}</div>
<div class="card"><b>Keluhan utama</b>${bars(Object.entries(kc).sort((a,b)=>b[1]-a[1]),Math.max(0,...Object.values(kc)))||""}${m.length?"":"<p>Tidak ada data.</p>"}</div>
<div class="card tbl"><b>Tabel kunjungan</b><small style="color:var(--mu);display:block">Nama pasien tidak ditampilkan pada rekap umum.</small><table><tr><th>Tanggal</th><th>ID Pasien</th><th>Dokter</th><th>Keluhan</th><th>Status</th></tr>${m.map(v=>`<tr><td>${fd(v.tgl)}</td><td>${v.pid}</td><td>${v.dok}</td><td>${v.kel.map(kn).join(", ")}</td><td>${v.status}</td></tr>`).join("")}</table></div>`}
function dok(){const m=D.V.filter(v=>v.tgl.startsWith(mon)),rows=DOK.map(d=>{const x=m.filter(v=>v.dok===d);return{d,t:x.length,u:new Set(x.map(v=>v.pid)).size,b:x.filter(v=>v.jenis==="Baru").length,k:x.filter(v=>v.jenis==="Kontrol").length,s:x.filter(v=>v.status==="Selesai").length}});
return`<h2>Rekap per Dokter</h2>${mf()}<div class="card tbl" style="margin-top:12px"><table><tr><th>Dokter</th><th>Total</th><th>Pasien unik</th><th>Baru</th><th>Kontrol</th><th>Selesai</th><th>Belum</th></tr>${rows.map(r=>`<tr><td>${r.d}</td><td>${r.t}</td><td>${r.u}</td><td>${r.b}</td><td>${r.k}</td><td>${r.s}</td><td>${r.t-r.s}</td></tr>`).join("")}</table></div>
<div class="card"><b>Kunjungan per dokter</b>${bars(rows.map(r=>[r.d,r.t]),Math.max(...rows.map(r=>r.t)))}</div><p style="color:var(--mu);font-size:12px">Rekap bersifat administratif, bukan penilaian kinerja klinis dokter.</p>`}
render();
</script>
</body>
</html>
